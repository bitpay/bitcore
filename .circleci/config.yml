# Javascript Node CircleCI 2.0 configuration file
# Check https://circleci.com/docs/2.0/language-javascript/ for more details
version: 2.1

executors:
  main:
    machine:
      image: default # https://discuss.circleci.com/t/linux-image-deprecations-and-eol-for-2024/50177
      docker_layer_caching: true
    resource_class: large
    working_directory: ~/bitcore
    environment:
      - DB_NAME: bitcore-test
      - DB_PORT: 7357
      - BITCORE_CONFIG_PATH: ~/bitcore/bitcore-test.config.json

commands:
  start_docker_images:
    description: Pull docker images for mongo and blockchain nodes
    steps:
      - run:
          name: Build & start blockchain containers
          command: |
            docker buildx prune -f
            docker compose -f docker-compose.test.base.yml -f docker-compose.test.ci.yml up --detach
  use_node:
    description: Pin the executor machine to the exact Node/npm pair recorded in root package.json (engines.node / packageManager)
    steps:
      - run:
          name: Use Node 24.22.1 / npm 10.9.2
          command: |
            nvm install 24.22.1
            nvm alias default 24.22.1
            nvm use default
            npm install -g npm@10.9.2
  npm_cache_restore:
    description: Restore npm's download cache (not an installed node_modules tree -- npm workspaces hoisting makes a restored tree stale as soon as any manifest changes, so `npm ci` always runs regardless of hit/miss; this cache only avoids re-downloading tarballs already fetched by prior runs)
    steps:
      - restore_cache:
          keys:
            - npm-dl-cache-v1-{{ arch }}-node24.22.1-npm10.9.2-{{ checksum "package-lock.json" }}-{{ checksum ".npmrc" }}
            - npm-dl-cache-v1-{{ arch }}-node24.22.1-npm10.9.2-
  npm_cache_save:
    steps:
      - save_cache:
          key: npm-dl-cache-v1-{{ arch }}-node24.22.1-npm10.9.2-{{ checksum "package-lock.json" }}-{{ checksum ".npmrc" }}
          paths:
            - ~/.npm
  run_test:
    description: Execute the test suite for a package
    parameters:
      package:
        type: string
    steps:
      - attach_workspace:
          at: ~/bitcore
      - use_node
      - start_docker_images
      - run:
          name: Run << parameters.package >> tests
          command: |
            nvm use default
            node scripts/workspaces/check-runtime.cjs
            npm run compile
            npm run test:<< parameters.package >>

jobs:
  build:
    executor: main
    steps:
      - checkout
      - use_node
      - run:
          name: Print versions
          command: |
            nvm use default
            set -x && node -v && npm -v && google-chrome --version && docker version && python3 --version
      - run:
          name: Runtime preflight (before any install machinery runs)
          command: |
            nvm use default
            node scripts/workspaces/check-runtime.cjs
      - run:
          name: Verify workspace manifests/lock before install
          command: |
            nvm use default
            node scripts/workspaces/verify.cjs manifests --structure-only
            node scripts/workspaces/verify.cjs lock
      - npm_cache_restore
      - run:
          name: npm ci
          command: |
            nvm use default
            npm ci --foreground-scripts
      - npm_cache_save
      - run:
          name: Verify workspace links/engines/artifacts after install
          command: |
            nvm use default
            node scripts/workspaces/verify.cjs manifests
            node scripts/workspaces/verify.cjs engines
            node scripts/workspaces/verify.cjs links
            node scripts/workspaces/verify.cjs artifacts --stage=build
            npm ls --workspaces --depth=0
      - run:
          name: Run workspace orchestration tests
          command: |
            nvm use default
            node --test test/workspaces/*.test.cjs
      - run:
          name: Confirm install/compile made no tracked changes
          command: |
            git diff --exit-code -- package.json package-lock.json packages
      - persist_to_workspace:
          root: ~/bitcore
          paths:
            - .
  bitcore-node:
    executor: main
    steps:
      - run_test:
          package: bitcore-node
  bitcore-wallet-service:
    executor: main
    steps:
      - run_test:
          package: bitcore-wallet-service
  bitcore-wallet-client:
    executor: main
    steps:
      - run_test:
          package: bitcore-wallet-client
  crypto-wallet-core:
    executor: main
    steps:
      - run_test:
          package: crypto-wallet-core
  bitcore-cli:
    executor: main
    steps:
      - run_test:
          package: bitcore-cli
  bitcore-lib:
    executor: main
    steps:
      - run_test:
          package: bitcore-lib
  bitcore-lib-cash:
    executor: main
    steps:
      - run_test:
          package: bitcore-lib-cash
  bitcore-lib-doge:
    executor: main
    steps:
      - run_test:
          package: bitcore-lib-doge
  bitcore-lib-ltc:
    executor: main
    steps:
      - run_test:
          package: bitcore-lib-ltc
  bitcore-logging:
    executor: main
    steps:
      - run_test:
          package: bitcore-logging
  bitcore-mnemonic:
    executor: main
    steps:
      - run_test:
          package: bitcore-mnemonic
  bitcore-p2p:
    executor: main
    steps:
      - run_test:
          package: bitcore-p2p
  bitcore-p2p-cash:
    executor: main
    steps:
      - run_test:
          package: bitcore-p2p-cash
  bitcore-p2p-doge:
    executor: main
    steps:
      - run_test:
          package: bitcore-p2p-doge
  bitcore-client:
    executor: main
    steps:
      - run_test:
          package: bitcore-client
  bitcore-tss:
    executor: main
    steps:
      - run_test:
          package: bitcore-tss
  crypto-rpc:
    executor: main
    steps:
      - run_test:
          package: crypto-rpc

workflows:
  version: 2
  build_and_test:
    jobs:
      - build
      - bitcore-node:
          requires:
            - build
      - bitcore-wallet-service:
          requires:
            - build
      - bitcore-wallet-client:
          requires:
            - build
      - crypto-wallet-core:
          requires:
            - build
      - bitcore-lib:
          requires:
            - build
      - bitcore-lib-cash:
          requires:
            - build
      - bitcore-lib-doge:
          requires:
            - build
      - bitcore-lib-ltc:
          requires:
            - build
      - bitcore-logging:
          requires:
            - build
      - bitcore-mnemonic:
          requires:
            - build
      - bitcore-p2p:
          requires:
            - build
      - bitcore-p2p-cash:
          requires:
            - build
      - bitcore-p2p-doge:
          requires:
            - build
      - bitcore-client:
          requires:
            - build
      - bitcore-tss:
          requires:
            - build
      - bitcore-cli:
          requires:
            - build
      - crypto-rpc:
